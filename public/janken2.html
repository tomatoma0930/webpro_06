<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>じゃんけん（ラジオボタン）</title>
</head>
<body>
  <h1>じゃんけん</h1>
  <form action="/janken2" method="get">
    <fieldset>
      <legend>出す手</legend>
      <input type="radio" id="rock" name="hand" value="グー" required>
      <label for="rock">グー</label>
      <input type="radio" id="scissors" name="hand" value="チョキ">
      <label for="scissors">チョキ</label>
      <input type="radio" id="paper" name="hand" value="パー">
      <label for="paper">パー</label>
    </fieldset>
    <input type="hidden" name="win" value="0">
    <input type="hidden" name="total" value="0">
    <button type="submit">じゃんけんポン</button>
  </form>
  <p><a href="/public/index.html">トップへ戻る</a></p>
</body>
</html>
