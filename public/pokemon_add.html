<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ポケモンを追加</title>
</head>
<body>
  <h1>ポケモンを追加</h1>
  <form action="/pokemon_add" method="get">
    <p><label for="number">図鑑番号</label> <input type="number" id="number" name="number" min="1" required></p>
    <p><label for="name">名前</label> <input type="text" id="name" name="name" required></p>
    <p><label for="type">タイプ</label> <input type="text" id="type" name="type" required></p>
    <p><label for="category">分類</label> <input type="text" id="category" name="category" required></p>
    <p><label for="height">高さ（m）</label> <input type="number" id="height" name="height" min="0.001" step="any" required></p>
    <p><label for="weight">重さ（kg）</label> <input type="number" id="weight" name="weight" min="0.001" step="any" required></p>
    <button type="submit">登録</button>
  </form>
  <p><a href="/pokemon">図鑑に戻る</a></p>
</body>
</html>
